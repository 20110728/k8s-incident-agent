apiVersion: v1
kind: Namespace
metadata:
  name: agent-demo
  labels:
    app.kubernetes.io/part-of: k8s-incident-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-dependency
  namespace: agent-demo
  labels:
    app: order-dependency
    app.kubernetes.io/name: order-dependency
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-dependency
  template:
    metadata:
      labels:
        app: order-dependency
        app.kubernetes.io/name: order-dependency
        app.kubernetes.io/part-of: k8s-incident-agent
        app.kubernetes.io/version: order-demo-v0.2.0
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-dependency
        image: k8s-incident-demo:0.2.0
        imagePullPolicy: Never
        args:
        - dependency
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: order-dependency
  namespace: agent-demo
  labels:
    app: order-dependency
    app.kubernetes.io/name: order-dependency
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app: order-dependency
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: agent-demo
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: k8s-incident-agent
        app.kubernetes.io/version: order-demo-v0.2.0
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-service
        image: k8s-incident-demo:0.2.0
        imagePullPolicy: Never
        args:
        - order
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: ORDER_FAULT_MODE
          value: normal
        - name: DEPENDENCY_URL
          value: http://order-dependency.agent-demo.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: agent-demo
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: k8s-incident-agent
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
