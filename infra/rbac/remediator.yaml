apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-remediator
  namespace: agent-demo
rules:
  # RBAC limits resource names/verbs, NOT patch fields. Field checks live in the executor.
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - order-service
    verbs:
      - get
      - patch

  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - order-service
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-remediator-binding
  namespace: agent-demo
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-agent-remediator
